name: Quality

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: content_analyzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d content_analyzer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SKIP_ENV_VALIDATION: '1'
      DATABASE_URL: postgresql://user:password@localhost:5432/content_analyzer
      ACCESS_PASSWORD: test-password
      JWT_SECRET: test-only-jwt-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - run: npx prisma db push --skip-generate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
