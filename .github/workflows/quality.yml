name: Quality

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKIP_ENV_VALIDATION: '1'
      DATABASE_URL: postgresql://user:password@localhost:5432/content_analyzer
      ACCESS_PASSWORD: test-password
      JWT_SECRET: test-only-jwt-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
